version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: multi_agent_reports
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d multi_agent_reports"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "7861:7861"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://ai_user:ai_password@db:5432/multi_agent_reports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
